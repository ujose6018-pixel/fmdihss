<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacia Domiciliaria - IHSS</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FIREBASE (Base de Datos) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Configuración personalizada de colores -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        turquesa: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e' },
                        clinico: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' },
                        slate: { 850: '#1e293b' }
                    },
                    fontFamily: {

    </script>
    
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; color: #334155; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .hover-lift { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .hover-lift:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // =================================================================================
        // CONFIGURACIÓN FIREBASE
        // =================================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDQebp7hzz-WpWL_rq_AnPJB7-LZBfW6_A",
            authDomain: "farmacia-ihss.firebaseapp.com",
            projectId: "farmacia-ihss",
            storageBucket: "farmacia-ihss.firebasestorage.app",
            messagingSenderId: "79918968312",
            appId: "1:79918968312:web:57c12b2a380305cb607a0d"
        };

        let db;
        let isOnline = false;

        const createMockFirestore = () => {
            console.log("⚠️ Conexión fallida. Usando Base de Datos Local (Modo Respaldo)...");
            const getLocal = (col) => { const d = localStorage.getItem(`mock_${col}`); return d ? JSON.parse(d) : []; };
            const setLocal = (col, d) => localStorage.setItem(`mock_${col}`, JSON.stringify(d));
            const listeners = {};
            const notify = (col) => { if(listeners[col]) { const d = getLocal(col); listeners[col].forEach(cb => cb({ docs: d.map(x => ({ id: x.id, data: () => x })) })); }};

            return {
                collection: (name) => ({
                    add: (data) => new Promise(resolve => {
                        const list = getLocal(name); const newItem = { id: Date.now().toString(), ...data };
                        list.push(newItem); setLocal(name, list); notify(name); resolve({ id: newItem.id });
                    }),
                    onSnapshot: (cb) => {
                        if (!listeners[name]) listeners[name] = []; listeners[name].push(cb); notify(name);
                        return () => { listeners[name] = listeners[name].filter(x => x !== cb); };
                    },
                    doc: (id) => ({
                        update: (updates) => new Promise(resolve => {
                            let list = getLocal(name);
                            list = list.map(item => {
                                if (item.id === id) {
                                    if (updates.logs && Array.isArray(updates.logs) && typeof updates.logs[0] === 'string' && updates.logs[0].includes("MOCK_LOG")) {
                                        const cleanLog = updates.logs[0].replace("MOCK_LOG:", "");
                                        return { ...item, ...updates, logs: [...(item.logs||[]), cleanLog] };
                                    }
                                    return { ...item, ...updates };
                                }
                                return item;
                            });
                            setLocal(name, list); notify(name); resolve();
                        }),
                        delete: () => new Promise(resolve => {
                            let list = getLocal(name);
                            list = list.filter(item => item.id !== id);
                            setLocal(name, list); notify(name); resolve();
                        })
                    })
                })
            };
        };

        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            isOnline = true;
            console.log("✅ Conectado a Firebase: farmacia-ihss");
        } catch (error) {
            console.error("Error conexión:", error);
            db = createMockFirestore();
            isOnline = false;
        }

        // =================================================================================
        // DEFINICIONES GLOBALES
        // =================================================================================
        const STATUS = {
            CREATED: 'CREADO',
            ASSIGNED: 'ASIGNADO_FARMACIA',
            CONFIRMED: 'CONFIRMADO_CC',
            DISPENSED: 'DISPENSADO',
            OPS_PROCESSING: 'EN_PROCESO_OPS', 
            OPS_OK: 'VERIFICADO_OPS',
            QUAL_OK: 'VERIFICADO_CALIDAD',
            ROUTED: 'EN_RUTA',
            DELIVERED: 'ENTREGADO'
        };

        const INITIAL_USERS_SEED = [
            { username: 'admin', password: '123', role: 'ADMIN', name: 'Administrador Principal' },
            { username: 'far1', password: '123', role: 'FARMACIA', name: 'Farmacéutico Juan' },
            { username: 'far2', password: '123', role: 'FARMACIA', name: 'Farmacéutica Ana' },
            { username: 'cc1', password: '123', role: 'CC', name: 'Agente CC Carlos' },
            { username: 'cc2', password: '123', role: 'CC', name: 'Agente CC Sofia' },
            { username: 'ops1', password: '123', role: 'OPS', name: 'Operador Roberto' },
            { username: 'log1', password: '123', role: 'LOGISTICA', name: 'Jefe Logística' },
            { username: 'del1', password: '123', role: 'DELIVERY', name: 'Motorista 1' },
            { username: 'calidad1', password: '123', role: 'CALIDAD', name: 'Auditor Calidad' }
        ];

        // =================================================================================
        // COMPONENTES UI
        // =================================================================================
        const IconWrapper = ({ children, size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const User = (p) => <IconWrapper {...p}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconWrapper>;
        const Lock = (p) => <IconWrapper {...p}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconWrapper>;
        const Search = (p) => <IconWrapper {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></IconWrapper>;
        const LogOut = (p) => <IconWrapper {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></IconWrapper>;
        const Users = (p) => <IconWrapper {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconWrapper>;
        const FileText = (p) => <IconWrapper {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></IconWrapper>;
        const CheckCircle = (p) => <IconWrapper {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconWrapper>;
        const Truck = (p) => <IconWrapper {...p}><path d="M5 18H3c-.6 0-1-.4-1-1V9.4c0-.6.4-1 1-1h16v4.6"/><path d="M10 18h4"/><path d="M19 18h2c.6 0 1-.4 1-1v-4.2c0-.3-.1-.5-.3-.7l-2.8-3.6c-.2-.2-.4-.3-.7-.3H14"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></IconWrapper>;
        const XCircle = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><line x1="15" x2="9" y1="9" y2="15"/><line x1="9" x2="15" y1="9" y2="15"/></IconWrapper>;
        const Edit = (p) => <IconWrapper {...p}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></IconWrapper>;
        const Trash = (p) => <IconWrapper {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></IconWrapper>;
        const Menu = (p) => <IconWrapper {...p}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></IconWrapper>;
        const Layout = (p) => <IconWrapper {...p}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></IconWrapper>;

        const Button = ({ onClick, children, variant = "primary", className = "", icon: Icon, disabled = false }) => {
            const styles = {
                primary: "bg-turquesa-600 hover:bg-turquesa-700 text-white shadow-lg shadow-turquesa-500/30",
                success: "bg-clinico-600 hover:bg-clinico-700 text-white shadow-lg shadow-clinico-500/30",
                warning: "bg-amber-500 hover:bg-amber-600 text-white shadow-lg shadow-amber-500/30",
                danger: "bg-rose-500 hover:bg-rose-600 text-white shadow-lg shadow-rose-500/30",
                neutral: "bg-white hover:bg-gray-50 text-slate-700 border border-slate-200 shadow-sm"
            };
            return (
                <button onClick={onClick} disabled={disabled} type="button" className={`flex items-center gap-2 px-5 py-2.5 rounded-xl font-medium transition-all duration-300 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed hover:-translate-y-0.5 ${styles[variant]} ${className}`}>
                    {Icon && <Icon size={18} />}
                    {children}
                </button>
            );
        };

        const Card = ({ title, children, color = "bg-white", headerAction }) => (
            <div className={`hover-lift bg-white rounded-2xl border border-slate-100 shadow-md mb-6 overflow-hidden ${color} fade-in`}>
                <div className="bg-white px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                    <h3 className="text-lg font-bold text-slate-800 flex items-center gap-3">
                        <span className="w-1.5 h-6 bg-turquesa-500 rounded-full inline-block"></span>
                        {title}
                    </h3>
                    {headerAction}
                </div>
                <div className="p-6">{children}</div>
            </div>
        );

        const Modal = ({ isOpen, onClose, title, message, children, type = "info", onConfirm }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 relative transform transition-all scale-100">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors"><XCircle size={24}/></button>
                        <div className="flex items-center gap-3 mb-4">
                            <div className={`w-10 h-10 rounded-full flex items-center justify-center ${type === 'error' ? 'bg-rose-100 text-rose-600' : type === 'success' ? 'bg-clinico-100 text-clinico-600' : 'bg-turquesa-100 text-turquesa-600'}`}>
                                {type === 'error' ? <XCircle size={20}/> : type === 'success' ? <CheckCircle size={20}/> : <FileText size={20}/>}
                            </div>
                            <h3 className="text-xl font-bold text-slate-800">{title}</h3>
                        </div>
                        <div className="text-slate-600 mb-6">{message || children}</div>
                        <div className="flex gap-3 justify-end">
                            {onConfirm ? (
                                <>
                                    <Button variant="neutral" onClick={onClose}>Cancelar</Button>
                                    <Button variant="primary" onClick={() => { onConfirm(); onClose(); }}>Confirmar</Button>
                                </>
                            ) : (
                                !children && <Button variant="primary" className="w-full justify-center" onClick={onClose}>Entendido</Button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // =================================================================================
        // LOGIN
        // =================================================================================
        const Login = ({ onLogin, usersDB, seedDB, isOnline, isSeeding, setModal }) => {
            const [user, setUser] = useState('');
            const [pass, setPass] = useState('');
            
            const handleLogin = (e) => {
                e.preventDefault();
                const found = usersDB.find(u => u.username === user && u.password === pass);
                if (found) { onLogin(found); } else { setModal({ isOpen: true, title: "Acceso Denegado", message: "Credenciales incorrectas.", type: "error" }); }
            };

            const handleSeedClick = () => {
                setModal({ isOpen: true, title: "Inicializar Sistema", message: "¿Crear usuarios predeterminados?", type: "info", onConfirm: seedDB });
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-50 relative overflow-hidden">
                    <div className="absolute top-0 w-full h-1/2 bg-turquesa-600 rounded-b-[3rem] shadow-lg z-0"></div>
                    <div className="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-sm fade-in relative z-10 mx-4 border border-slate-100">
                        <div className="flex flex-col items-center mb-8">
                            <div className="bg-turquesa-50 p-4 rounded-2xl mb-4 shadow-sm">
                                <Truck size={40} className="text-turquesa-600" />
                            </div>
                            <h1 className="text-2xl font-bold text-slate-800 text-center">Farmacia Domiciliaria</h1>
                            <p className="text-clinico-600 font-semibold tracking-wide text-sm mt-1">IHSS A TU CASA</p>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-5">
                            <div className="relative group">
                                <User className="absolute left-3 top-3.5 text-slate-400 group-hover:text-turquesa-500 transition-colors" size={18} />
                                <input className="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-turquesa-500 focus:border-transparent outline-none transition-all hover:bg-white" value={user} onChange={e => setUser(e.target.value)} placeholder="Usuario" autoFocus />
                            </div>
                            <div className="relative group">
                                <Lock className="absolute left-3 top-3.5 text-slate-400 group-hover:text-turquesa-500 transition-colors" size={18} />
                                <input type="password" className="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-turquesa-500 focus:border-transparent outline-none transition-all hover:bg-white" value={pass} onChange={e => setPass(e.target.value)} placeholder="Contraseña" />
                            </div>
                            <button className="w-full bg-turquesa-600 hover:bg-turquesa-700 text-white py-3.5 rounded-xl font-bold shadow-lg shadow-turquesa-500/30 transition-all hover:-translate-y-0.5 active:scale-95">Ingresar al Sistema</button>
                        </form>
                        {usersDB.length === 0 && (
                            <div className="mt-6 text-center">
                                <button type="button" onClick={handleSeedClick} disabled={isSeeding} className="text-xs font-bold text-turquesa-600 hover:underline">{isSeeding ? 'Configurando...' : 'Inicializar Base de Datos'}</button>
                            </div>
                        )}
                        <p className="mt-8 text-center text-[10px] text-slate-400 uppercase tracking-widest">Plataforma Segura v3.1</p>
                    </div>
                </div>
            );
        };

        // =================================================================================
        // BLOQUE 1: ADMIN - DASHBOARD Y SIDEBAR
        // =================================================================================
        const Block1Admin = ({ orders, users, setModal }) => {
            const [view, setView] = useState('dashboard');
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [formData, setFormData] = useState({ name: '', id: '', phone: '', assignedPharma: '' });
            const [newUser, setNewUser] = useState({ username: '', role: 'FARMACIA', name: '' });
            const [editingUser, setEditingUser] = useState(null);
            const [editForm, setEditForm] = useState({ password: '', role: '' });

            const pharmaUsers = users.filter(u => u.role === 'FARMACIA');

            // Stats
            const stats = {
                totalOrders: orders.length,
                pending: orders.filter(o => o.status !== STATUS.DELIVERED).length,
                completed: orders.filter(o => o.status === STATUS.DELIVERED).length,
                staff: users.length
            };

            // Handlers
            const handleCreateDH = async (e) => {
                e.preventDefault();
                if(!formData.assignedPharma) return setModal({isOpen:true, title:"Error", message:"Asigna un farmacéutico", type:"error"});
                try {
                    await db.collection('orders').add({
                        createdAt: new Date(),
                        dhName: formData.name, dhId: formData.id, dhPhone: formData.phone,
                        status: STATUS.CREATED, assignedPharma: formData.assignedPharma, assignedCC: null, assignedOps: null, medications: [], logs: [`Creado por Admin`]
                    });
                    setFormData({ name: '', id: '', phone: '', assignedPharma: '' });
                    setModal({isOpen:true, title:"Éxito", message:"Expediente creado", type:"success"});
                } catch(err) { setModal({isOpen:true, title:"Error", message:err.message, type:"error"}); }
            };

            const handleCreateUser = async (e) => {
                e.preventDefault();
                try {
                    await db.collection('users').add({ ...newUser, password: '123' });
                    setNewUser({ username: '', role: 'FARMACIA', name: '' });
                    setModal({isOpen:true, title:"Éxito", message:"Usuario creado (Clave: 123)", type:"success"});
                } catch(err) { setModal({isOpen:true, title:"Error", message:err.message, type:"error"}); }
            };

            const handleDeleteUser = (userId) => {
                setModal({ isOpen: true, title: "Eliminar Usuario", message: "¿Estás seguro?", type: "error", onConfirm: async () => {
                    try { await db.collection('users').doc(userId).delete(); setModal({isOpen:true, title:"Eliminado", message:"Usuario borrado", type:"success"}); } 
                    catch(err) { setModal({isOpen:true, title:"Error", message: err.message, type:"error"}); }
                }});
            };

            const openEditUser = (user) => { setEditingUser(user); setEditForm({ password: user.password, role: user.role }); };
            const handleUpdateUser = async () => {
                if(!editingUser) return;
                try {
                    await db.collection('users').doc(editingUser.id).update({ password: editForm.password, role: editForm.role });
                    setEditingUser(null); setModal({isOpen:true, title:"Actualizado", message:"Credenciales actualizadas", type:"success"});
                } catch(err) { setModal({isOpen:true, title:"Error", message:err.message, type:"error"}); }
            };

            return (
                <div className="flex h-[80vh] gap-6 transition-all">
                    {/* Sidebar Retráctil */}
                    <aside className={`bg-white border border-slate-200 rounded-2xl shadow-sm flex flex-col transition-all duration-300 ${sidebarOpen ? 'w-64' : 'w-20'} overflow-hidden`}>
                        <div className="p-4 flex items-center justify-between border-b border-slate-100 bg-slate-50">
                            {sidebarOpen && <span className="font-bold text-slate-700 ml-2 truncate">Menú Admin</span>}
                            <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-2 hover:bg-white rounded-lg text-slate-500 transition-colors shadow-sm"><Menu size={20} /></button>
                        </div>
                        <nav className="flex-1 p-3 space-y-1">
                            {[
                                { id: 'dashboard', label: 'Resumen', icon: Layout },
                                { id: 'new_dh', label: 'Pacientes', icon: FileText },
                                { id: 'users', label: 'Personal', icon: Users },
                            ].map(item => (
                                <button key={item.id} onClick={() => setView(item.id)} className={`w-full flex items-center gap-3 p-3 rounded-xl transition-all ${view === item.id ? 'bg-turquesa-50 text-turquesa-700 font-bold shadow-sm' : 'text-slate-500 hover:bg-slate-50'}`}>
                                    <item.icon size={22} />
                                    {sidebarOpen && <span className="truncate">{item.label}</span>}
                                </button>
                            ))}
                        </nav>
                    </aside>

                    {/* Área Principal */}
                    <div className="flex-1 overflow-y-auto pr-2 pb-4">
                        {view === 'dashboard' && (
                            <div className="space-y-6 fade-in">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm hover-lift">
                                        <div className="text-slate-400 text-sm font-bold uppercase mb-2">Total Pacientes</div>
                                        <div className="text-4xl font-bold text-turquesa-600">{stats.totalOrders}</div>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm hover-lift">
                                        <div className="text-slate-400 text-sm font-bold uppercase mb-2">Pendientes Entrega</div>
                                        <div className="text-4xl font-bold text-amber-500">{stats.pending}</div>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm hover-lift">
                                        <div className="text-slate-400 text-sm font-bold uppercase mb-2">Personal Activo</div>
                                        <div className="text-4xl font-bold text-slate-700">{stats.staff}</div>
                                    </div>
                                </div>
                                <div className="bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
                                    <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2"><div className="w-1 h-5 bg-turquesa-500 rounded-full"></div> Actividad Reciente</h3>
                                    <div className="space-y-0 divider-y divide-slate-50">
                                        {orders.length === 0 ? <p className="text-slate-400 italic">Sin actividad.</p> : orders.slice(0, 8).map(o => (
                                            <div key={o.id} className="flex justify-between items-center py-3 px-2 hover:bg-slate-50 rounded-lg transition-colors border-b border-slate-50 last:border-0">
                                                <div><p className="font-bold text-slate-700 text-sm">{o.dhName}</p><p className="text-xs text-slate-400">ID: {o.dhId}</p></div>
                                                <span className="text-[10px] uppercase font-bold px-2 py-1 bg-slate-100 text-slate-500 rounded-full">{o.status.replace(/_/g, ' ')}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'new_dh' && (
                            <div className="fade-in">
                                <Card title="Ingreso de Paciente">
                                    <form onSubmit={handleCreateDH} className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="space-y-1"><label className="text-xs font-bold text-slate-500 uppercase">Nombre</label><input required className="w-full border border-slate-200 bg-slate-50 p-3 rounded-xl focus:bg-white focus:ring-2 focus:ring-turquesa-500 outline-none transition-all" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} /></div>
                                        <div className="space-y-1"><label className="text-xs font-bold text-slate-500 uppercase">DNI / Afiliación</label><input required className="w-full border border-slate-200 bg-slate-50 p-3 rounded-xl focus:bg-white focus:ring-2 focus:ring-turquesa-500 outline-none transition-all" value={formData.id} onChange={e => setFormData({...formData, id: e.target.value})} /></div>
                                        <div className="space-y-1"><label className="text-xs font-bold text-slate-500 uppercase">Teléfono</label><input required className="w-full border border-slate-200 bg-slate-50 p-3 rounded-xl focus:bg-white focus:ring-2 focus:ring-turquesa-500 outline-none transition-all" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} /></div>
                                        <div className="space-y-1"><label className="text-xs font-bold text-slate-500 uppercase">Asignar a</label>
                                            <select required className="w-full border border-slate-200 bg-slate-50 p-3 rounded-xl focus:bg-white focus:ring-2 focus:ring-turquesa-500 outline-none transition-all" value={formData.assignedPharma} onChange={e => setFormData({...formData, assignedPharma: e.target.value})}>
                                                <option value="">-- Seleccionar Farmacéutico --</option>
                                                {pharmaUsers.map(u => <option key={u.id} value={u.username}>{u.name}</option>)}
                                            </select>
                                        </div>
                                        <div className="md:col-span-2 pt-2"><Button className="w-full justify-center py-3" icon={FileText}>Crear Expediente</Button></div>
                                    </form>
                                </Card>
                            </div>
                        )}

                        {view === 'users' && (
                            <div className="space-y-6 fade-in">
                                <Card title="Registrar Nuevo Colaborador">
                                    <form onSubmit={handleCreateUser} className="flex flex-col md:flex-row gap-4 items-end bg-slate-50 p-5 rounded-xl border border-slate-200">
                                        <div className="flex-1 w-full"><label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Usuario</label><input required className="w-full border p-2 rounded-lg" value={newUser.username} onChange={e => setNewUser({...newUser, username: e.target.value})} /></div>
                                        <div className="flex-[2] w-full"><label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Nombre</label><input required className="w-full border p-2 rounded-lg" value={newUser.name} onChange={e => setNewUser({...newUser, name: e.target.value})} /></div>
                                        <div className="flex-1 w-full"><label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Rol</label>
                                            <select className="w-full border p-2 rounded-lg bg-white" value={newUser.role} onChange={e => setNewUser({...newUser, role: e.target.value})}>
                                                <option value="FARMACIA">Farmacia</option><option value="CC">Contact Center</option><option value="OPS">Operaciones</option><option value="CALIDAD">Calidad</option><option value="LOGISTICA">Logística</option>
                                            </select>
                                        </div>
                                        <Button variant="success" icon={Users}>Crear</Button>
                                    </form>
                                </Card>
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="px-6 py-4 border-b border-slate-100 bg-slate-50 font-bold text-slate-700">Directorio de Usuarios</div>
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-slate-50 text-slate-500 uppercase font-bold text-xs"><tr><th className="px-6 py-3">Usuario</th><th className="px-6 py-3">Nombre</th><th className="px-6 py-3">Rol</th><th className="px-6 py-3 text-right">Acciones</th></tr></thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {users.map(u => (
                                                <tr key={u.id} className="hover:bg-slate-50 transition-colors">
                                                    <td className="px-6 py-4 font-medium text-turquesa-700">{u.username}</td>
                                                    <td className="px-6 py-4">{u.name}</td>
                                                    <td className="px-6 py-4"><span className="px-2 py-1 rounded-full bg-slate-100 text-slate-600 text-xs font-bold">{u.role}</span></td>
                                                    <td className="px-6 py-4 text-right flex justify-end gap-2">
                                                        <button onClick={() => openEditUser(u)} className="p-1.5 rounded-lg text-slate-400 hover:text-turquesa-600 hover:bg-turquesa-50" title="Editar"><Edit size={18}/></button>
                                                        <button onClick={() => handleDeleteUser(u.id)} className="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50" title="Eliminar"><Trash size={18}/></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </div>

                    {editingUser && (
                        <Modal isOpen={true} onClose={() => setEditingUser(null)} title="Modificar Credenciales">
                            <div className="space-y-4">
                                <p className="text-sm text-slate-500">Editando: <strong>{editingUser.name}</strong></p>
                                <div><label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Nueva Contraseña</label><input className="w-full border p-2 rounded-lg" type="text" value={editForm.password} onChange={e => setEditForm({...editForm, password: e.target.value})} /></div>
                                <div><label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Rol</label><select className="w-full border p-2 rounded-lg bg-white" value={editForm.role} onChange={e => setEditForm({...editForm, role: e.target.value})}><option value="FARMACIA">Farmacia</option><option value="CC">Contact Center</option><option value="OPS">Operaciones</option><option value="CALIDAD">Calidad</option><option value="LOGISTICA">Logística</option><option value="ADMIN">Admin</option></select></div>
                                <div className="flex gap-2 justify-end mt-4"><Button variant="neutral" onClick={() => setEditingUser(null)}>Cancelar</Button><Button variant="primary" onClick={handleUpdateUser}>Guardar</Button></div>
                            </div>
                        </Modal>
                    )}
                </div>
            );
        };

        // ... [REST OF THE BLOCKS: FARMACIA, CC, OPS, CALIDAD, LOGISTICA, DELIVERY REMAIN UNCHANGED] ...
        // (Copiaré el resto de los bloques exactamente como estaban para asegurar la consistencia del archivo final)

        const Block2Pharmacy = ({ orders, updateOrder, currentUser, setModal }) => {
            const myOrders = orders.filter(o => o.assignedPharma === currentUser.username);
            const pending = myOrders.filter(o => o.status === STATUS.CREATED);
            const toDispense = myOrders.filter(o => o.status === STATUS.CONFIRMED);
            const [meds, setMeds] = useState({});
            const handleAssign = (id) => { if(!meds[id]) return setModal({isOpen:true, title:"Atención", message:"Ingrese medicamentos", type:"error"}); updateOrder(id, STATUS.ASSIGNED, { medications: meds[id].split(',') }); };
            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between"><div><h2 className="text-xl font-bold text-slate-800">Panel Farmacia</h2><p className="text-turquesa-600 font-medium">Hola, {currentUser.name}</p></div><div className="text-right"><div className="text-3xl font-bold text-turquesa-500">{pending.length + toDispense.length}</div><div className="text-xs font-bold text-slate-400 uppercase tracking-wide">Pendientes</div></div></div>
                    <Card title="Asignación de Medicamentos">{pending.length === 0 ? <p className="text-slate-400 italic text-center py-8">No hay pacientes pendientes de asignación.</p> : pending.map(o => (<div key={o.id} className="border border-slate-100 bg-slate-50 p-5 rounded-xl shadow-sm mb-3 hover:bg-white transition-colors group"><div className="flex flex-col md:flex-row gap-4 items-center justify-between"><div className="flex items-center gap-4"><div className="bg-white p-3 rounded-full text-turquesa-600 font-bold text-xs shadow-sm border border-slate-100">{o.dhId}</div><div><div className="font-bold text-lg text-slate-700">{o.dhName}</div><div className="text-xs text-slate-500 font-mono">{o.dhPhone}</div></div></div><div className="flex gap-2 w-full md:w-auto items-center"><input className="border border-slate-200 p-2.5 rounded-lg flex-1 outline-none w-64 focus:ring-2 focus:ring-turquesa-500 focus:bg-white transition-all bg-white" placeholder="Escribir medicamentos..." onChange={e => setMeds({...meds, [o.id]: e.target.value})} /><Button onClick={() => handleAssign(o.id)}>Enviar</Button></div></div></div>))}</Card>
                    <Card title="Dispensación (Retorno CC)" color="bg-clinico-50">{toDispense.length === 0 ? <p className="text-slate-400 italic text-center py-4">Bandeja de dispensación vacía.</p> : toDispense.map(o => (<div key={o.id} className="bg-white p-5 rounded-xl shadow-sm mb-3 flex justify-between items-center border-l-4 border-clinico-500 hover:shadow-md transition-all"><div><div className="font-bold text-slate-800">{o.dhName}</div><div className="text-xs text-clinico-600 font-bold bg-clinico-50 inline-block px-2 py-1 rounded mt-1 border border-clinico-100">Entrega: {o.deliveryDate}</div><div className="text-xs text-slate-500 mt-2">Receta: {o.medications?.join(', ')}</div></div><Button variant="success" onClick={() => updateOrder(o.id, STATUS.DISPENSED)} icon={CheckCircle}>Dispensar</Button></div>))}</Card>
                </div>
            );
        };

        const Block3CC = ({ orders, updateOrder, currentUser, setModal }) => {
            const pool = orders.filter(o => o.status === STATUS.ASSIGNED && !o.assignedCC);
            const myCases = orders.filter(o => o.assignedCC === currentUser.username && o.status === STATUS.ASSIGNED);
            const [form, setForm] = useState({});
            const confirmCase = (id) => { if(!form[id]?.date || !form[id]?.addr) return setModal({isOpen:true, title:"Atención", message:"Faltan datos", type:"error"}); updateOrder(id, STATUS.CONFIRMED, { deliveryDate: form[id].date, address: form[id].addr }); };
            return (
                <div className="space-y-6">
                    <Card title={`Bolsa de Llamadas (${pool.length})`} color="bg-turquesa-50">{pool.length === 0 ? <p className="text-slate-400 text-center py-4">No hay llamadas entrantes.</p> : pool.map(o => (<div key={o.id} className="bg-white p-4 rounded-xl shadow-sm mb-2 flex justify-between items-center border border-turquesa-100 hover:border-turquesa-300 transition-colors"><div className="flex gap-3 items-center"><div className="w-10 h-10 rounded-full bg-turquesa-50 flex items-center justify-center text-turquesa-600"><FileText size={20}/></div><div><div className="font-bold text-slate-700">{o.dhName}</div><div className="text-sm text-slate-500">{o.dhPhone}</div></div></div><Button variant="primary" onClick={() => updateOrder(o.id, STATUS.ASSIGNED, { assignedCC: currentUser.username })}>Tomar Caso</Button></div>))}</Card>
                    <Card title="Mis Llamadas Activas">{myCases.length === 0 ? <p className="text-slate-400 text-center py-4">No tienes casos activos.</p> : myCases.map(o => (<div key={o.id} className="border border-slate-200 p-6 rounded-xl mb-4 bg-slate-50 hover:bg-white hover:shadow-md transition-all"><div className="font-bold text-lg mb-4 text-turquesa-700 flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> {o.dhName}</div><div className="grid grid-cols-1 md:grid-cols-2 gap-4"><div className="space-y-1"><label className="text-[10px] uppercase font-bold text-slate-400">Fecha Entrega</label><input type="date" className="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-turquesa-500 outline-none" onChange={e => setForm({...form, [o.id]: { ...form[o.id], date: e.target.value }})} /></div><div className="space-y-1"><label className="text-[10px] uppercase font-bold text-slate-400">Dirección</label><input type="text" placeholder="Dirección exacta..." className="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-turquesa-500 outline-none" onChange={e => setForm({...form, [o.id]: { ...form[o.id], addr: e.target.value }})} /></div></div><div className="mt-4 flex justify-end"><Button variant="success" onClick={() => confirmCase(o.id)}>Confirmar Envío</Button></div></div>))}</Card>
                </div>
            );
        };

        const Block4Ops = ({ orders, updateOrder, currentUser }) => {
            const waitlist = orders.filter(o => o.status === STATUS.DISPENSED && !o.assignedOps);
            const myTasks = orders.filter(o => o.assignedOps === currentUser.username && o.status === STATUS.OPS_PROCESSING);
            const [searchTerm, setSearchTerm] = useState('');
            const filteredWaitlist = waitlist.filter(o => o.dhName.toLowerCase().includes(searchTerm.toLowerCase()));
            return (
                <div className="space-y-6">
                    <Card title={`Mi Espacio de Trabajo (${myTasks.length})`} color="bg-amber-50 border-amber-100">{myTasks.length === 0 ? <p className="text-amber-700/50 text-center py-4">Sin tareas en proceso.</p> : myTasks.map(o => (<div key={o.id} className="bg-white p-5 rounded-xl shadow-md mb-4 border-l-4 border-amber-400 hover:transform hover:scale-[1.01] transition-all"><div className="flex justify-between items-start"><div><h4 className="font-bold text-lg text-slate-800">{o.dhName}</h4><p className="text-sm text-slate-600 mt-2 bg-slate-100 p-2 rounded inline-block">📦 {o.medications?.join(', ')}</p></div><span className="bg-amber-100 text-amber-800 text-xs px-2 py-1 rounded font-bold uppercase tracking-wide">Revisión</span></div><div className="mt-4 flex justify-end"><Button variant="warning" onClick={() => updateOrder(o.id, STATUS.OPS_OK)} icon={CheckCircle}>Validar</Button></div></div>))}</Card>
                    <Card title="Cola de Espera"><div className="relative mb-6"><Search className="absolute left-3 top-3 text-slate-400" size={20} /><input className="w-full pl-10 pr-4 py-3 border border-slate-200 bg-slate-50 rounded-xl outline-none focus:bg-white focus:ring-2 focus:ring-turquesa-500 transition-all" placeholder="Buscar paciente por nombre..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} /></div><div className="space-y-2">{filteredWaitlist.map(o => (<div key={o.id} className="p-4 border border-slate-100 rounded-xl hover:bg-slate-50 flex justify-between items-center transition-all group hover:shadow-sm"><div><div className="font-bold text-slate-700">{o.dhName}</div><div className="text-xs text-slate-400">{o.medications?.length} items</div></div><Button variant="neutral" onClick={() => updateOrder(o.id, STATUS.OPS_PROCESSING, { assignedOps: currentUser.username })}>Tomar</Button></div>))}</div></Card>
                </div>
            );
        };

        const Block5Quality = ({ orders, updateOrder }) => {
            const list = orders.filter(o => o.status === STATUS.OPS_OK);
            return (<Card title="Control de Calidad">{list.length === 0 ? <p className="text-slate-400 text-center py-4">Sin pendientes de calidad.</p> : list.map(o => (<div key={o.id} className="flex justify-between items-center p-4 border-b last:border-0 border-slate-100 hover:bg-slate-50 transition-colors"><span className="font-medium text-slate-700">{o.dhName}</span><Button variant="success" onClick={() => updateOrder(o.id, STATUS.QUAL_OK)}>Aprobar</Button></div>))}</Card>);
        };

        const Block6Logistics = ({ orders, updateOrder }) => {
            const list = orders.filter(o => o.status === STATUS.QUAL_OK);
            return (<Card title="Logística y Ruteo">{list.length === 0 ? <p className="text-slate-400 text-center py-4">No hay paquetes para ruta.</p> : list.map(o => (<div key={o.id} className="flex justify-between items-center p-4 border-b last:border-0 border-slate-100 hover:bg-slate-50 transition-colors"><div><div className="font-bold text-slate-700">{o.dhName}</div><div className="text-xs text-slate-500">{o.address}</div></div><Button variant="primary" onClick={() => updateOrder(o.id, STATUS.ROUTED, { driver: 'Moto 1' })} icon={Truck}>Asignar Moto</Button></div>))}</Card>);
        };

        const Block7Delivery = ({ orders, updateOrder }) => {
            const list = orders.filter(o => o.status === STATUS.ROUTED);
            return (<Card title="Ruta Activa (Delivery)" color="bg-clinico-50">{list.length === 0 ? <p className="text-slate-400 text-center py-4">Ruta vacía.</p> : list.map(o => (<div key={o.id} className="bg-white p-6 rounded-xl mb-4 shadow-md border border-clinico-200"><div className="font-bold text-lg text-slate-800">{o.dhName}</div><div className="text-slate-600 bg-slate-50 p-3 rounded-lg mt-2 text-sm border border-slate-100">{o.address}</div><div className="mt-4"><Button variant="success" className="w-full justify-center py-3" onClick={() => updateOrder(o.id, STATUS.DELIVERED)}>Confirmar Entrega</Button></div></div>))}</Card>);
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [orders, setOrders] = useState([]);
            const [usersDB, setUsersDB] = useState([]);
            const [isSeeding, setIsSeeding] = useState(false);
            const [modal, setModal] = useState({ isOpen: false, title: "", message: "", type: "info" });
            const closeModal = () => setModal({ ...modal, isOpen: false });

            useEffect(() => {
                if(!db) return;
                const unsubUsers = db.collection('users').onSnapshot(snapshot => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setUsersDB(data);
                });
                const unsubOrders = db.collection('orders').onSnapshot(snapshot => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    data.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                    setOrders(data);
                });
                return () => { unsubUsers(); unsubOrders(); };
            }, []);

            const updateOrder = async (id, status, extra = {}) => {
                if(!db) return;
                try {
                    let logUpdate;
                    if (isOnline && firebase.firestore.FieldValue) { logUpdate = firebase.firestore.FieldValue.arrayUnion(`[${status}] ${user.username} - ${new Date().toLocaleTimeString()}`); } 
                    else { logUpdate = [`MOCK_LOG:[${status}] ${user.username} - ${new Date().toLocaleTimeString()}`]; }
                    await db.collection('orders').doc(id).update({ status, ...extra, logs: logUpdate });
                } catch(e) { console.error("Error update:", e); }
            };

            const seedDB = async () => {
                if (!db) return setModal({ isOpen: true, title: "Error", message: "Sin conexión a BD.", type: "error" });
                setIsSeeding(true);
                try {
                    const promises = INITIAL_USERS_SEED.map(u => db.collection('users').add(u));
                    await Promise.all(promises);
                    setModal({ isOpen: true, title: "¡Listo!", message: "Base de datos inicializada. \nUsuario: admin \nClave: 123", type: "success" });
                } catch (error) { setModal({ isOpen: true, title: "Error", message: error.message, type: "error" }); } finally { setIsSeeding(false); }
            };

            const renderBlock = () => {
                const props = { orders, users: usersDB, setModal, updateOrder, currentUser: user };
                switch(user.role) {
                    case 'ADMIN': return <Block1Admin {...props} />;
                    case 'FARMACIA': return <Block2Pharmacy {...props} />;
                    case 'CC': return <Block3CC {...props} />;
                    case 'OPS': return <Block4Ops {...props} />;
                    case 'CALIDAD': return <Block5Quality {...props} />;
                    case 'LOGISTICA': return <Block6Logistics {...props} />;
                    case 'DELIVERY': return <Block7Delivery {...props} />;
                    default: return <div className="text-center p-10 text-slate-400">Rol no reconocido</div>;
                }
            };

            return (
                <div className="min-h-screen bg-slate-50 pb-10 font-sans">
                    <Modal {...modal} onClose={closeModal} />
                    {!user ? (
                        <Login onLogin={setUser} usersDB={usersDB} seedDB={seedDB} isOnline={isOnline} isSeeding={isSeeding} setModal={setModal} />
                    ) : (
                        <>
                            <header className="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-20 backdrop-blur-md bg-white/80">
                                <div className="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
                                    <div className="flex items-center gap-4">
                                        <div className="bg-turquesa-50 p-2 rounded-xl text-turquesa-600"><Truck size={24} /></div>
                                        <div><h1 className="font-bold text-slate-800 text-lg leading-none">Farmacia Domiciliaria</h1><p className="text-xs text-clinico-600 font-bold mt-0.5 tracking-wider">IHSS A TU CASA</p></div>
                                    </div>
                                    <div className="flex items-center gap-6">
                                        <div className="hidden md:flex flex-col items-end">
                                            <span className="text-sm font-bold text-slate-700">{user.name}</span>
                                            <span className="text-[10px] uppercase font-bold text-white bg-slate-400 px-2 py-0.5 rounded-full">{user.role}</span>
                                        </div>
                                        <button onClick={() => setUser(null)} className="text-slate-400 hover:text-rose-500 transition-colors p-2 hover:bg-rose-50 rounded-lg"><LogOut size={20} /></button>
                                    </div>
                                </div>
                            </header>
                            <main className="max-w-5xl mx-auto p-6 mt-4 fade-in">{renderBlock()}</main>
                        </>
                    )}
                    <div className={`fixed bottom-0 w-full text-center text-[10px] py-1 font-bold ${isOnline ? 'bg-clinico-500 text-white' : 'bg-rose-500 text-white'}`}>
                        {isOnline ? "CONECTADO: FIREBASE CLOUD" : "MODO LOCAL (OFFLINE)"}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
