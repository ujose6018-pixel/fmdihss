<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacia Domiciliaria - IHSS</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FIREBASE (Base de Datos) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Configuración personalizada de colores -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        turquesa: { 50: '#ecfeff', 100: '#cffafe', 500: '#06b6d4', 600: '#0891b2', 700: '#0e7490' },
                        clinico: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857' }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #f3f6f8; font-family: 'Segoe UI', system-ui, sans-serif; }
        .fade-in { animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #0891b2; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // =================================================================================
        // BLOQUE DE CONFIGURACIÓN Y CONEXIÓN
        // =================================================================================
        
        const firebaseConfig = {
            apiKey: "AIzaSyDQebp7hzz-WpWL_rq_AnPJB7-LZBfW6_A",
            authDomain: "farmacia-ihss.firebaseapp.com",
            projectId: "farmacia-ihss",
            storageBucket: "farmacia-ihss.firebasestorage.app",
            messagingSenderId: "79918968312",
            appId: "1:79918968312:web:57c12b2a380305cb607a0d"
        };

        let db;
        let isOnline = false;

        // Función de respaldo en caso de fallo de conexión (Mock DB)
        const createMockFirestore = () => {
            console.log("⚠️ Conexión fallida. Usando Base de Datos Local (Modo Respaldo)...");
            const getLocal = (col) => { const d = localStorage.getItem(`mock_${col}`); return d ? JSON.parse(d) : []; };
            const setLocal = (col, d) => localStorage.setItem(`mock_${col}`, JSON.stringify(d));
            const listeners = {};
            const notify = (col) => { if(listeners[col]) { const d = getLocal(col); listeners[col].forEach(cb => cb({ docs: d.map(x => ({ id: x.id, data: () => x })) })); }};

            return {
                collection: (name) => ({
                    add: (data) => new Promise(resolve => {
                        const list = getLocal(name); const newItem = { id: Date.now().toString(), ...data };
                        list.push(newItem); setLocal(name, list); notify(name); resolve({ id: newItem.id });
                    }),
                    onSnapshot: (cb) => {
                        if (!listeners[name]) listeners[name] = []; listeners[name].push(cb); notify(name);
                        return () => { listeners[name] = listeners[name].filter(x => x !== cb); };
                    },
                    doc: (id) => ({
                        update: (updates) => new Promise(resolve => {
                            let list = getLocal(name);
                            list = list.map(item => {
                                if (item.id === id) {
                                    if (updates.logs && Array.isArray(updates.logs) && typeof updates.logs[0] === 'string' && updates.logs[0].includes("MOCK_LOG")) {
                                        const cleanLog = updates.logs[0].replace("MOCK_LOG:", "");
                                        return { ...item, ...updates, logs: [...(item.logs||[]), cleanLog] };
                                    }
                                    return { ...item, ...updates };
                                }
                                return item;
                            });
                            setLocal(name, list); notify(name); resolve();
                        })
                    })
                })
            };
        };

        // Inicialización de Firebase
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            isOnline = true;
            console.log("✅ Conectado a Firebase: farmacia-ihss");
        } catch (error) {
            console.error("Error conexión:", error);
            db = createMockFirestore();
            isOnline = false;
        }

        // =================================================================================
        // DEFINICIONES GLOBALES
        // =================================================================================

        const STATUS = {
            CREATED: 'CREADO',
            ASSIGNED: 'ASIGNADO_FARMACIA',
            CONFIRMED: 'CONFIRMADO_CC',
            DISPENSED: 'DISPENSADO',
            OPS_PROCESSING: 'EN_PROCESO_OPS', 
            OPS_OK: 'VERIFICADO_OPS',
            QUAL_OK: 'VERIFICADO_CALIDAD',
            ROUTED: 'EN_RUTA',
            DELIVERED: 'ENTREGADO'
        };

        const INITIAL_USERS_SEED = [
            { username: 'admin', password: '123', role: 'ADMIN', name: 'Administrador Principal' },
            { username: 'far1', password: '123', role: 'FARMACIA', name: 'Farmacéutico Juan' },
            { username: 'far2', password: '123', role: 'FARMACIA', name: 'Farmacéutica Ana' },
            { username: 'cc1', password: '123', role: 'CC', name: 'Agente CC Carlos' },
            { username: 'cc2', password: '123', role: 'CC', name: 'Agente CC Sofia' },
            { username: 'ops1', password: '123', role: 'OPS', name: 'Operador Roberto' },
            { username: 'log1', password: '123', role: 'LOGISTICA', name: 'Jefe Logística' },
            { username: 'del1', password: '123', role: 'DELIVERY', name: 'Motorista 1' },
            { username: 'calidad1', password: '123', role: 'CALIDAD', name: 'Auditor Calidad' }
        ];

        // =================================================================================
        // COMPONENTES DE UI
        // =================================================================================
        
        const IconWrapper = ({ children, size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const User = (p) => <IconWrapper {...p}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconWrapper>;
        const Lock = (p) => <IconWrapper {...p}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconWrapper>;
        const Search = (p) => <IconWrapper {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></IconWrapper>;
        const LogOut = (p) => <IconWrapper {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></IconWrapper>;
        const Users = (p) => <IconWrapper {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconWrapper>;
        const FileText = (p) => <IconWrapper {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></IconWrapper>;
        const CheckCircle = (p) => <IconWrapper {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconWrapper>;
        const Truck = (p) => <IconWrapper {...p}><path d="M5 18H3c-.6 0-1-.4-1-1V9.4c0-.6.4-1 1-1h16v4.6"/><path d="M10 18h4"/><path d="M19 18h2c.6 0 1-.4 1-1v-4.2c0-.3-.1-.5-.3-.7l-2.8-3.6c-.2-.2-.4-.3-.7-.3H14"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></IconWrapper>;
        const XCircle = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><line x1="15" x2="9" y1="9" y2="15"/><line x1="9" x2="15" y1="9" y2="15"/></IconWrapper>;

        // UI Components
        const Button = ({ onClick, children, variant = "primary", className = "", icon: Icon, disabled = false }) => {
            const styles = {
                primary: "bg-turquesa-600 hover:bg-turquesa-700 text-white shadow-md shadow-turquesa-600/20",
                success: "bg-clinico-500 hover:bg-clinico-600 text-white shadow-md shadow-clinico-500/20",
                warning: "bg-amber-400 hover:bg-amber-500 text-white shadow-md",
                danger: "bg-red-500 hover:bg-red-600 text-white",
                neutral: "bg-gray-100 hover:bg-gray-200 text-gray-700 border border-gray-200"
            };
            return (
                <button onClick={onClick} disabled={disabled} type="button" className={`flex items-center gap-2 px-5 py-2.5 rounded-lg font-semibold transition-all duration-200 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed ${styles[variant]} ${className}`}>
                    {Icon && <Icon size={18} />}
                    {children}
                </button>
            );
        };

        const Card = ({ title, children, color = "bg-white", headerAction }) => (
            <div className={`shadow-lg rounded-2xl p-0 mb-8 ${color} fade-in border border-gray-100 overflow-hidden`}>
                <div className="bg-gradient-to-r from-gray-50 to-white px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                    <h3 className="text-lg font-bold text-turquesa-700 flex items-center gap-2">
                        <span className="w-2 h-6 bg-turquesa-500 rounded-full inline-block"></span>
                        {title}
                    </h3>
                    {headerAction}
                </div>
                <div className="p-6">{children}</div>
            </div>
        );

        // Componente Modal Personalizado (Reemplazo de alert/confirm)
        const Modal = ({ isOpen, onClose, title, message, type = "info", onConfirm }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 relative">
                        <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><XCircle size={24}/></button>
                        <div className={`w-12 h-12 rounded-full flex items-center justify-center mb-4 ${type === 'error' ? 'bg-red-100 text-red-500' : type === 'success' ? 'bg-green-100 text-green-500' : 'bg-blue-100 text-blue-500'}`}>
                            {type === 'error' ? <XCircle size={24}/> : type === 'success' ? <CheckCircle size={24}/> : <FileText size={24}/>}
                        </div>
                        <h3 className="text-xl font-bold text-gray-800 mb-2">{title}</h3>
                        <p className="text-gray-600 mb-6">{message}</p>
                        <div className="flex gap-3 justify-end">
                            {onConfirm ? (
                                <>
                                    <Button variant="neutral" onClick={onClose}>Cancelar</Button>
                                    <Button variant="primary" onClick={() => { onConfirm(); onClose(); }}>Confirmar</Button>
                                </>
                            ) : (
                                <Button variant="primary" className="w-full justify-center" onClick={onClose}>Entendido</Button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // =================================================================================
        // BLOQUES FUNCIONALES (COMPONENTES INDEPENDIENTES)
        // =================================================================================

        // BLOQUE 0: LOGIN
        const Login = ({ onLogin, usersDB, seedDB, isOnline, isSeeding, setModal }) => {
            const [user, setUser] = useState('');
            const [pass, setPass] = useState('');
            
            const handleLogin = (e) => {
                e.preventDefault();
                const found = usersDB.find(u => u.username === user && u.password === pass);
                if (found) { 
                    onLogin(found); 
                } else { 
                    setModal({ isOpen: true, title: "Acceso Denegado", message: "Usuario o contraseña incorrectos.", type: "error" });
                }
            };

            const handleSeedClick = () => {
                setModal({
                    isOpen: true,
                    title: "Inicializar Base de Datos",
                    message: "¿Deseas crear los usuarios por defecto (admin, farmacia, etc)? Esto es necesario para el primer uso.",
                    type: "info",
                    onConfirm: seedDB
                });
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-turquesa-600 via-teal-500 to-clinico-600">
                    <div className="bg-white/95 backdrop-blur-sm p-10 rounded-3xl shadow-2xl w-full max-w-md fade-in border-t-8 border-turquesa-500 relative overflow-hidden">
                        
                        <div className="flex flex-col items-center mb-8 relative z-10">
                            <div className="p-4 bg-turquesa-50 rounded-2xl mb-4 shadow-inner">
                                <Truck size={40} className="text-turquesa-600" />
                            </div>
                            <h1 className="text-3xl font-extrabold text-gray-800 text-center">Farmacia Domiciliaria</h1>
                            <p className="text-clinico-600 font-bold tracking-wide mt-1">IHSS A TU CASA</p>
                        </div>
                        
                        <form onSubmit={handleLogin} className="space-y-5 relative z-10">
                            <div>
                                <label className="block text-sm font-semibold text-gray-600 mb-1.5 ml-1">Usuario</label>
                                <div className="relative">
                                    <User className="absolute left-3 top-3 text-gray-400" size={18} />
                                    <input className="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-turquesa-500 outline-none" 
                                        value={user} onChange={e => setUser(e.target.value)} placeholder="Ej: admin" autoFocus />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-600 mb-1.5 ml-1">Contraseña</label>
                                <div className="relative">
                                    <Lock className="absolute left-3 top-3 text-gray-400" size={18} />
                                    <input type="password" className="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-turquesa-500 outline-none" 
                                        value={pass} onChange={e => setPass(e.target.value)} placeholder="••••••" />
                                </div>
                            </div>
                            
                            <button type="submit" className="w-full bg-gradient-to-r from-turquesa-600 to-turquesa-500 text-white py-3.5 rounded-xl font-bold hover:shadow-lg hover:shadow-turquesa-500/30 transform transition hover:-translate-y-0.5">
                                Iniciar Sesión Segura
                            </button>
                        </form>
                        
                        {usersDB.length === 0 && (
                            <div className="mt-6 text-center relative z-10">
                                <button 
                                    type="button"
                                    onClick={handleSeedClick} 
                                    disabled={isSeeding}
                                    className={`text-xs font-bold underline ${isSeeding ? 'text-gray-400 cursor-not-allowed' : 'text-blue-600 hover:text-blue-800'}`}
                                >
                                    {isSeeding ? 'Creando base de datos...' : 'Inicializar Base de Datos (Primer uso)'}
                                </button>
                            </div>
                        )}
                        <div className="mt-8 text-center relative z-10"><p className="text-xs text-gray-400">Plataforma Oficial de Dispensación v2.6</p></div>
                    </div>
                </div>
            );
        };

        // BLOQUE 1: ADMIN
        const Block1Admin = ({ orders, users, setModal }) => {
            const [tab, setTab] = useState('new_dh'); 
            const [formData, setFormData] = useState({ name: '', id: '', phone: '', assignedPharma: '' });
            const [newUser, setNewUser] = useState({ username: '', role: 'FARMACIA', name: '' });
            const pharmaUsers = users.filter(u => u.role === 'FARMACIA');

            const handleCreateDH = async (e) => {
                e.preventDefault();
                if(!formData.assignedPharma) return setModal({isOpen:true, title:"Error", message:"Asigna un farmacéutico", type:"error"});
                try {
                    await db.collection('orders').add({
                        createdAt: new Date(),
                        dhName: formData.name, dhId: formData.id, dhPhone: formData.phone,
                        status: STATUS.CREATED, assignedPharma: formData.assignedPharma, assignedCC: null, assignedOps: null, medications: [], logs: [`Creado por Admin`]
                    });
                    setFormData({ name: '', id: '', phone: '', assignedPharma: '' });
                    setModal({isOpen:true, title:"Éxito", message:"Paciente registrado exitosamente", type:"success"});
                } catch(err) { console.error(err); setModal({isOpen:true, title:"Error", message:err.message, type:"error"}); }
            };

            const handleCreateUser = async (e) => {
                e.preventDefault();
                try {
                    await db.collection('users').add({ ...newUser, password: '123' });
                    setNewUser({ username: '', role: 'FARMACIA', name: '' });
                    setModal({isOpen:true, title:"Éxito", message:"Usuario creado correctamente", type:"success"});
                } catch(err) { console.error(err); setModal({isOpen:true, title:"Error", message:err.message, type:"error"}); }
            };

            return (
                <div className="space-y-6">
                    <div className="flex gap-4 mb-2">
                        <Button variant={tab === 'new_dh' ? 'primary' : 'neutral'} onClick={() => setTab('new_dh')} icon={FileText}>Registro Paciente</Button>
                        <Button variant={tab === 'users' ? 'primary' : 'neutral'} onClick={() => setTab('users')} icon={Users}>Gestión Usuarios</Button>
                    </div>

                    {tab === 'new_dh' && (
                        <Card title="Ingreso de Paciente IHSS">
                            <form onSubmit={handleCreateDH} className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="space-y-1"><label className="text-xs font-bold text-gray-500 uppercase">Nombre Completo</label><input required className="w-full border p-3 rounded-lg focus:ring-2 focus:ring-turquesa-500 outline-none" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} /></div>
                                <div className="space-y-1"><label className="text-xs font-bold text-gray-500 uppercase">DNI / Número Afiliación</label><input required className="w-full border p-3 rounded-lg focus:ring-2 focus:ring-turquesa-500 outline-none" value={formData.id} onChange={e => setFormData({...formData, id: e.target.value})} /></div>
                                <div className="space-y-1"><label className="text-xs font-bold text-gray-500 uppercase">Teléfono Contacto</label><input required className="w-full border p-3 rounded-lg focus:ring-2 focus:ring-turquesa-500 outline-none" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} /></div>
                                <div className="space-y-1"><label className="text-xs font-bold text-gray-500 uppercase">Asignar Farmacéutico</label>
                                    <select required className="w-full border p-3 rounded-lg bg-white focus:ring-2 focus:ring-turquesa-500 outline-none" value={formData.assignedPharma} onChange={e => setFormData({...formData, assignedPharma: e.target.value})}>
                                        <option value="">-- Seleccionar --</option>
                                        {pharmaUsers.map(u => <option key={u.id} value={u.username}>{u.name}</option>)}
                                    </select>
                                </div>
                                <div className="md:col-span-2 pt-2"><Button className="w-full justify-center py-3">Crear Expediente</Button></div>
                            </form>
                        </Card>
                    )}
                    {tab === 'users' && (
                        <Card title="Creación de Personal">
                            <form onSubmit={handleCreateUser} className="flex flex-col md:flex-row gap-4 items-end mb-8 bg-gray-50 p-4 rounded-xl border border-gray-200">
                                <div className="flex-1 w-full"><label className="text-xs font-bold text-gray-500 uppercase mb-1 block">Usuario</label><input required className="w-full border p-2 rounded" value={newUser.username} onChange={e => setNewUser({...newUser, username: e.target.value})} /></div>
                                <div className="flex-[2] w-full"><label className="text-xs font-bold text-gray-500 uppercase mb-1 block">Nombre Personal</label><input required className="w-full border p-2 rounded" value={newUser.name} onChange={e => setNewUser({...newUser, name: e.target.value})} /></div>
                                <div className="flex-1 w-full"><label className="text-xs font-bold text-gray-500 uppercase mb-1 block">Departamento</label>
                                    <select className="w-full border p-2 rounded bg-white" value={newUser.role} onChange={e => setNewUser({...newUser, role: e.target.value})}>
                                        <option value="FARMACIA">Farmacia</option><option value="CC">Contact Center</option><option value="OPS">Operaciones</option><option value="CALIDAD">Calidad</option><option value="LOGISTICA">Logística</option>
                                    </select>
                                </div>
                                <Button variant="success" icon={Users}>Registrar</Button>
                            </form>
                        </Card>
                    )}
                </div>
            );
        };

        // BLOQUE 2: FARMACIA
        const Block2Pharmacy = ({ orders, updateOrder, currentUser, setModal }) => {
            const myOrders = orders.filter(o => o.assignedPharma === currentUser.username);
            const pending = myOrders.filter(o => o.status === STATUS.CREATED);
            const toDispense = myOrders.filter(o => o.status === STATUS.CONFIRMED);
            const [meds, setMeds] = useState({});

            const handleAssign = (id) => {
                if(!meds[id]) return setModal({isOpen:true, title:"Atención", message:"Ingrese medicamentos", type:"error"});
                updateOrder(id, STATUS.ASSIGNED, { medications: meds[id].split(',') });
            };

            return (
                <div className="space-y-6">
                    <div className="bg-gradient-to-r from-turquesa-50 to-white p-6 rounded-xl border border-turquesa-100 flex items-center justify-between">
                        <div><h2 className="text-xl font-bold text-turquesa-800">Panel de Farmacia</h2><p className="text-turquesa-600">Bienvenido, {currentUser.name}</p></div>
                        <div className="text-3xl font-bold text-turquesa-500">{pending.length + toDispense.length} <span className="text-sm font-normal text-gray-500">pendientes</span></div>
                    </div>
                    <Card title="1. Asignación de Medicamentos (Nuevos)">
                        {pending.length === 0 ? <p className="text-gray-400 italic text-center py-4">Sin pacientes nuevos asignados.</p> : 
                            pending.map(o => (
                                <div key={o.id} className="border border-gray-100 bg-white p-5 rounded-xl shadow-sm mb-3">
                                    <div className="flex flex-col md:flex-row gap-4 items-center justify-between">
                                        <div className="flex items-center gap-3">
                                            <div className="bg-turquesa-100 p-2 rounded-full text-turquesa-600 font-bold text-xs">{o.dhId}</div>
                                            <div><div className="font-bold text-lg text-gray-800">{o.dhName}</div><div className="text-xs text-gray-500">{o.dhPhone}</div></div>
                                        </div>
                                        <div className="flex gap-2 w-full md:w-auto items-center">
                                            <input className="border-2 border-gray-100 p-2.5 rounded-lg flex-1 outline-none w-64" placeholder="Escribir medicamentos..." onChange={e => setMeds({...meds, [o.id]: e.target.value})} />
                                            <Button onClick={() => handleAssign(o.id)}>Enviar</Button>
                                        </div>
                                    </div>
                                </div>
                            ))
                        }
                    </Card>
                    <Card title="2. Dispensación Física (Listos para Empacar)" color="bg-clinico-50">
                        {toDispense.map(o => (
                            <div key={o.id} className="bg-white p-5 rounded-xl shadow-sm mb-3 flex justify-between items-center border-l-4 border-clinico-500">
                                <div>
                                    <div className="font-bold text-gray-800">{o.dhName}</div>
                                    <div className="text-sm text-clinico-600 font-bold bg-clinico-50 inline-block px-2 py-0.5 rounded mt-1">Entrega: {o.deliveryDate}</div>
                                    <div className="text-xs text-gray-500 mt-1">Meds: {o.medications?.join(', ')}</div>
                                </div>
                                <Button variant="success" onClick={() => updateOrder(o.id, STATUS.DISPENSED)} icon={CheckCircle}>Dispensar</Button>
                            </div>
                        ))}
                    </Card>
                </div>
            );
        };

        // BLOQUE 3: CC (Contact Center)
        const Block3CC = ({ orders, updateOrder, currentUser, setModal }) => {
            const pool = orders.filter(o => o.status === STATUS.ASSIGNED && !o.assignedCC);
            const myCases = orders.filter(o => o.assignedCC === currentUser.username && o.status === STATUS.ASSIGNED);
            const [form, setForm] = useState({});

            const confirmCase = (id) => {
                if(!form[id]?.date || !form[id]?.addr) return setModal({isOpen:true, title:"Atención", message:"Faltan datos (fecha o dirección)", type:"error"});
                updateOrder(id, STATUS.CONFIRMED, { deliveryDate: form[id].date, address: form[id].addr });
            };

            return (
                <div className="space-y-6">
                    <Card title={`Bolsa de Llamadas (${pool.length})`} color="bg-turquesa-50">
                        {pool.map(o => (
                            <div key={o.id} className="bg-white p-4 rounded-xl shadow-sm mb-2 flex justify-between items-center border border-turquesa-100">
                                <div className="flex gap-3 items-center">
                                    <div className="w-10 h-10 rounded-full bg-turquesa-100 flex items-center justify-center text-turquesa-600"><FileText size={20}/></div>
                                    <div><div className="font-bold">{o.dhName}</div><div className="text-sm text-gray-500">{o.dhPhone}</div></div>
                                </div>
                                <Button variant="primary" onClick={() => updateOrder(o.id, STATUS.ASSIGNED, { assignedCC: currentUser.username })}>Gestionar</Button>
                            </div>
                        ))}
                    </Card>
                    <Card title="Mis Llamadas Activas">
                        {myCases.map(o => (
                            <div key={o.id} className="border border-gray-200 p-5 rounded-xl mb-4 bg-gray-50">
                                <div className="font-bold text-lg mb-4 text-turquesa-700">{o.dhName}</div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <input type="date" className="w-full border p-2.5 rounded-lg" onChange={e => setForm({...form, [o.id]: { ...form[o.id], date: e.target.value }})} />
                                    <input type="text" placeholder="Dirección..." className="w-full border p-2.5 rounded-lg" onChange={e => setForm({...form, [o.id]: { ...form[o.id], addr: e.target.value }})} />
                                </div>
                                <div className="mt-4 flex justify-end"><Button variant="success" onClick={() => confirmCase(o.id)}>Confirmar Envío</Button></div>
                            </div>
                        ))}
                    </Card>
                </div>
            );
        };

        // BLOQUE 4: OPS (Operaciones)
        const Block4Ops = ({ orders, updateOrder, currentUser }) => {
            const waitlist = orders.filter(o => o.status === STATUS.DISPENSED && !o.assignedOps);
            const myTasks = orders.filter(o => o.assignedOps === currentUser.username && o.status === STATUS.OPS_PROCESSING);
            const [searchTerm, setSearchTerm] = useState('');
            const filteredWaitlist = waitlist.filter(o => o.dhName.toLowerCase().includes(searchTerm.toLowerCase()));

            return (
                <div className="space-y-6">
                    <Card title={`Mi Espacio de Trabajo (${myTasks.length})`} color="bg-amber-50 border-amber-200">
                        {myTasks.map(o => (
                            <div key={o.id} className="bg-white p-5 rounded-xl shadow-md mb-4 border-l-4 border-amber-400">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <h4 className="font-bold text-lg">{o.dhName}</h4>
                                        <p className="text-sm text-gray-600 mt-1 bg-gray-100 p-2 rounded">📦 {o.medications?.join(', ')}</p>
                                    </div>
                                    <span className="bg-amber-100 text-amber-800 text-xs px-2 py-1 rounded font-bold">REVISIÓN</span>
                                </div>
                                <div className="mt-4 flex justify-end"><Button variant="warning" onClick={() => updateOrder(o.id, STATUS.OPS_OK)} icon={CheckCircle}>Validar Pedido</Button></div>
                            </div>
                        ))}
                    </Card>
                    <Card title="Lista de Espera (Dispensados)">
                        <div className="relative mb-6">
                            <Search className="absolute left-3 top-3 text-gray-400" size={20} />
                            <input className="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl outline-none" placeholder="Buscar paciente..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                        </div>
                        <div className="space-y-2">
                            {filteredWaitlist.map(o => (
                                <div key={o.id} className="p-4 border rounded-xl hover:bg-gray-50 flex justify-between items-center transition-colors group">
                                    <div><div className="font-bold text-gray-800">{o.dhName}</div><div className="text-xs text-gray-400">{o.medications?.length} items</div></div>
                                    <Button variant="neutral" onClick={() => updateOrder(o.id, STATUS.OPS_PROCESSING, { assignedOps: currentUser.username })}>Tomar</Button>
                                </div>
                            ))}
                        </div>
                    </Card>
                </div>
            );
        };

        const Block5Quality = ({ orders, updateOrder }) => {
            const list = orders.filter(o => o.status === STATUS.OPS_OK);
            return (
                <Card title="Control de Calidad">
                    {list.map(o => (
                        <div key={o.id} className="flex justify-between items-center p-4 border-b last:border-0 hover:bg-gray-50">
                            <span className="font-medium">{o.dhName}</span>
                            <Button variant="success" onClick={() => updateOrder(o.id, STATUS.QUAL_OK)}>Aprobar</Button>
                        </div>
                    ))}
                    {list.length === 0 && <p className="text-gray-400 text-center py-4">Todo verificado.</p>}
                </Card>
            );
        };

        const Block6Logistics = ({ orders, updateOrder }) => {
            const list = orders.filter(o => o.status === STATUS.QUAL_OK);
            return (
                <Card title="Logística y Ruteo">
                    {list.map(o => (
                        <div key={o.id} className="flex justify-between items-center p-4 border-b hover:bg-gray-50">
                            <div><div className="font-bold text-turquesa-700">{o.dhName}</div><div className="text-xs text-gray-500">{o.address}</div></div>
                            <Button variant="primary" onClick={() => updateOrder(o.id, STATUS.ROUTED, { driver: 'Moto 1' })} icon={Truck}>Asignar Moto</Button>
                        </div>
                    ))}
                </Card>
            );
        };

        const Block7Delivery = ({ orders, updateOrder }) => {
            const list = orders.filter(o => o.status === STATUS.ROUTED);
            return (
                <Card title="Ruta Activa (Delivery)" color="bg-clinico-50">
                    {list.map(o => (
                        <div key={o.id} className="bg-white p-5 rounded-xl mb-3 shadow-md border border-clinico-100">
                            <div className="font-bold text-lg text-gray-800">{o.dhName}</div>
                            <div className="mb-4 text-gray-600 bg-gray-50 p-2 rounded mt-2 text-sm">{o.address}</div>
                            <Button variant="success" className="w-full justify-center py-3" onClick={() => updateOrder(o.id, STATUS.DELIVERED)}>Confirmar Entrega</Button>
                        </div>
                    ))}
                </Card>
            );
        };

        // =================================================================================
        // APLICACIÓN PRINCIPAL (ORQUESTADOR)
        // =================================================================================
        
        const App = () => {
            const [user, setUser] = useState(null);
            const [orders, setOrders] = useState([]);
            const [usersDB, setUsersDB] = useState([]);
            const [isSeeding, setIsSeeding] = useState(false);
            const [modal, setModal] = useState({ isOpen: false, title: "", message: "", type: "info" });

            const closeModal = () => setModal({ ...modal, isOpen: false });

            useEffect(() => {
                if(!db) return;

                // Escuchar Usuarios
                const unsubUsers = db.collection('users').onSnapshot(snapshot => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setUsersDB(data);
                });

                // Escuchar Ordenes
                const unsubOrders = db.collection('orders').onSnapshot(snapshot => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    data.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                    setOrders(data);
                });

                return () => { unsubUsers(); unsubOrders(); };
            }, []);

            const updateOrder = async (id, status, extra = {}) => {
                if(!db) return;
                try {
                    let logUpdate;
                    if (isOnline && firebase.firestore.FieldValue) {
                         logUpdate = firebase.firestore.FieldValue.arrayUnion(`[${status}] ${user.username} - ${new Date().toLocaleTimeString()}`);
                    } else {
                         logUpdate = [`MOCK_LOG:[${status}] ${user.username} - ${new Date().toLocaleTimeString()}`];
                    }
                    await db.collection('orders').doc(id).update({ status, ...extra, logs: logUpdate });
                } catch(e) { console.error("Error update:", e); }
            };

            const seedDB = async () => {
                if (!db) return setModal({ isOpen: true, title: "Error Crítico", message: "No hay conexión con la base de datos.", type: "error" });

                setIsSeeding(true);
                try {
                    console.log("Iniciando creación de usuarios...");
                    const promises = INITIAL_USERS_SEED.map(u => db.collection('users').add(u));
                    await Promise.all(promises);
                    setModal({ isOpen: true, title: "¡Éxito!", message: "Base de datos inicializada. Ya puedes entrar con:\nUsuario: admin\nContraseña: 123", type: "success" });
                } catch (error) {
                    console.error("Error al crear usuarios:", error);
                    setModal({ isOpen: true, title: "Error", message: "Hubo un error al crear los usuarios: " + error.message, type: "error" });
                } finally {
                    setIsSeeding(false);
                }
            };

            const renderBlock = () => {
                const props = { orders, users: usersDB, setModal, updateOrder, currentUser: user };
                switch(user.role) {
                    case 'ADMIN': return <Block1Admin {...props} />;
                    case 'FARMACIA': return <Block2Pharmacy {...props} />;
                    case 'CC': return <Block3CC {...props} />;
                    case 'OPS': return <Block4Ops {...props} />;
                    case 'CALIDAD': return <Block5Quality {...props} />;
                    case 'LOGISTICA': return <Block6Logistics {...props} />;
                    case 'DELIVERY': return <Block7Delivery {...props} />;
                    default: return <div>Rol no reconocido</div>;
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 pb-10">
                    <Modal {...modal} onClose={closeModal} />
                    
                    {!user ? (
                        <Login onLogin={setUser} usersDB={usersDB} seedDB={seedDB} isOnline={isOnline} isSeeding={isSeeding} setModal={setModal} />
                    ) : (
                        <>
                            <header className="bg-white shadow-md border-b-4 border-turquesa-500 sticky top-0 z-20">
                                <div className="max-w-6xl mx-auto px-6 py-3 flex justify-between items-center">
                                    <div className="flex items-center gap-4">
                                        <div className="bg-turquesa-50 p-2 rounded-xl"><Truck size={28} className="text-turquesa-600" /></div>
                                        <div><h1 className="font-extrabold text-gray-800 text-xl leading-none">Farmacia Domiciliaria</h1><p className="text-xs text-clinico-600 font-bold mt-0.5">IHSS A TU CASA</p></div>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <div className="hidden md:flex flex-col items-end mr-2">
                                            <span className="text-sm font-bold text-gray-700">{user.name}</span>
                                            <div className="flex gap-1">
                                                <span className="text-xs text-turquesa-600 font-medium bg-turquesa-50 px-2 rounded-full">{user.role}</span>
                                            </div>
                                        </div>
                                        <button onClick={() => setUser(null)} className="text-gray-400 hover:text-red-500 p-2"><LogOut size={20} /></button>
                                    </div>
                                </div>
                            </header>
                            <main className="max-w-5xl mx-auto p-6 mt-4 fade-in">{renderBlock()}</main>
                        </>
                    )}
                    
                    {/* Barra de estado inferior */}
                    <div className={`fixed bottom-0 w-full text-center text-[10px] py-1 font-bold ${isOnline ? 'bg-clinico-100 text-clinico-800' : 'bg-red-100 text-red-800'}`}>
                        ESTADO DE CONEXIÓN: {isOnline ? "ONLINE (FIREBASE)" : "OFFLINE (MODO LOCAL)"}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
