        const createMockFirestore = () => {
            console.log("⚠️ Modo Respaldo (Offline)");
            const getLocal = (k) => JSON.parse(localStorage.getItem(`mock_${k}`) || '[]');
            const setLocal = (k, v) => localStorage.setItem(`mock_${k}`, JSON.stringify(v));
            const listeners = {};
            const notify = (k) => listeners[k]?.forEach(cb => cb({ docs: getLocal(k).map(d => ({ id: d.id, data: () => d })) }));
            
            return {
                collection: (name) => ({
                    add: (data) => new Promise(r => {
                        const list = getLocal(name); const newItem = { id: data.id || Date.now().toString(), ...data };
                        if(name === 'patients') { const idx = list.findIndex(i=>i.id===newItem.id); if(idx>=0) list[idx]={...list[idx],...data}; else list.push(newItem); }
                        else list.push(newItem);
                        setLocal(name, list); notify(name); r({ id: newItem.id });
                    }),
                    doc: (id) => ({
                        set: (d, opt) => new Promise(r => {
                            let list = getLocal(name); const idx = list.findIndex(i=>i.id===id);
                            if(idx>=0) list[idx] = opt?.merge ? {...list[idx],...d} : {id,...d}; else list.push({id,...d});
                            setLocal(name, list); notify(name); r();
                        }),
                        update: (upd) => new Promise(r => {
                            let list = getLocal(name);
                            list = list.map(i => i.id === id ? { ...i, ...upd, logs: upd.logs ? [...(i.logs||[]), ...(upd.logs)] : i.logs } : i);
                            setLocal(name, list); notify(name); r();
                        }),
                        delete: () => new Promise(r => { setLocal(name, getLocal(name).filter(i=>i.id!==id)); notify(name); r(); })
                    }),
                    onSnapshot: (cb) => {
                        if(!listeners[name]) listeners[name] = []; listeners[name].push(cb); notify(name);
                        return () => listeners[name] = listeners[name].filter(x => x !== cb);
                    }
                })
            };
        };

            const [newUser, setNewUser] = useState({ username: '', role: 'FARMACIA', name: '' });

            const activeOrders = orders.filter(o => o.status !== 'ENTREGADO');
            const deliveredOrders = orders.filter(o => o.status === 'ENTREGADO');

            const geoDistribution = useMemo(() => {
                const sps = [], ceiba = [], foraneos = [];
                activeOrders.forEach(o => {
                    let zone = o.shippingZone || (o.municipality.toLowerCase().includes('san pedro') ? 'Local SPS' : o.municipality.toLowerCase().includes('ceiba') ? 'La Ceiba' : 'Foráneo');
                    if (zone === 'Local SPS') sps.push(o); else if (zone === 'La Ceiba') ceiba.push(o); else foraneos.push(o);
                });
                return { sps, ceiba, foraneos };
            }, [activeOrders]);

            const filteredPatients = patients.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.id.includes(searchTerm));

            const handleSavePatient = async (e) => { e.preventDefault(); try { await db.collection('patients').doc(formData.id).set(formData, {merge:true}); await db.collection('orders').add({...formData, createdAt: new Date(), dhId: formData.id, dhName: formData.name, status: 'CREADO', medications:[], logs:['Creado']}); setModal({isOpen:true, title:"Éxito", message:"Paciente creado", type:"success"}); setShowDHForm(false); } catch(e){ setModal({isOpen:true, title:"Error", message:e.message}); }};
            const handleCreateOrder = async () => { if(!orderForm.assignedPharma) return setModal({isOpen:true, title:"Faltan Datos", message:"Asigna personal."}); try { await db.collection('orders').add({...selectedPatient, ...orderForm, createdAt:new Date(), dhId:selectedPatient.id, dhName:selectedPatient.name, status:'CREADO', medications:[], logs:['Nueva Línea']}); setModal({isOpen:true, title:"Éxito", message:"Envío creado", type:"success"}); } catch(e){ setModal({isOpen:true, title:"Error", message:e.message}); }};
            const handleCreateUser = async (e) => { e.preventDefault(); try { await db.collection('users').add({ ...newUser, password: '123' }); setNewUser({ username: '', role: 'FARMACIA', name: '' }); setModal({isOpen:true, title:"Éxito", type:"success"}); } catch(err) { setModal({isOpen:true, title:"Error", message:err.message}); } };
            const handleDeleteUser = (userId) => { setModal({ isOpen: true, title: "Eliminar", message: "¿Seguro?", type: "error", onConfirm: async () => { try { await db.collection('users').doc(userId).delete(); } catch(err) {} }}); };
            const openEditUser = (user) => { setEditingUser(user); setEditForm({ password: user.password, role: user.role }); };
            const handleUpdateUser = async () => { if(!editingUser) return; try { await db.collection('users').doc(editingUser.id).update({ password: editForm.password, role: editForm.role }); setEditingUser(null); setModal({isOpen:true, title:"Ok", type:"success"}); } catch(err) {} };
            const handleBulkImport = async () => { try { const data = JSON.parse(importData); let count=0; for(const item of data) { await db.collection('patients').doc(item.id).set(item, {merge:true}); count++; } setModal({isOpen:true, title:"Importación", message:`${count} procesados.`, type:"success"}); setShowImport(false); } catch(e){ setModal({isOpen:true, title:"Error", message:e.message}); } };

            const getStatusBadge = (status) => {
                const config = { [STATUS.CREATED]: 'bg-gray-100', [STATUS.ASSIGNED]: 'bg-blue-100 text-blue-800', [STATUS.CONFIRMED]: 'bg-purple-100 text-purple-800', [STATUS.DISPENSED]: 'bg-indigo-100', [STATUS.OPS_PROCESSING]: 'bg-yellow-100', [STATUS.OPS_OK]: 'bg-amber-100', [STATUS.QUAL_PROCESSING]: 'bg-rose-100', [STATUS.QUAL_OK]: 'bg-teal-100', [STATUS.ROUTED]: 'bg-orange-100', [STATUS.IN_TRANSIT]: 'bg-cyan-100', [STATUS.DELIVERED]: 'bg-green-100 text-green-800' };
                return <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${config[status]||'bg-gray-100'}`}>{status}</span>;
            };

            const StatCard = ({ title, value, sub, color, onClick }) => (
                <div onClick={onClick} className={`bg-white p-6 rounded-2xl shadow-lg border-l-4 ${color} hover:scale-105 transition-transform cursor-pointer`}>
                    <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">{title}</h3>
                    <p className="text-3xl font-bold text-gray-800">{value}</p>
                    <p className="text-[10px] text-gray-400 mt-1">{sub}</p>
                </div>
            );

            const ZoneCard = ({ title, count, type, onClick }) => {
                const colors = { sps: 'from-blue-500 to-cyan-500', ceiba: 'from-emerald-500 to-teal-500', foraneos: 'from-indigo-500 to-purple-500' };
                return (
                    <div onClick={onClick} className={`relative overflow-hidden rounded-2xl p-6 text-white bg-gradient-to-br ${colors[type]} shadow-xl cursor-pointer hover:shadow-2xl transition-all group`}>
                        <div className="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-white opacity-20 rounded-full blur-2xl group-hover:scale-150 transition-transform"></div>
                        <div className="relative z-10">
                            <div className="flex justify-between items-start mb-4"><Icons.MapPin className="opacity-80"/> <span className="bg-white/20 px-2 py-0.5 rounded text-[10px] font-bold">ZONA ACTIVA</span></div>
                            <h3 className="text-lg font-bold opacity-90">{title}</h3>
                            <p className="text-4xl font-extrabold my-2">{count}</p>
                            <div className="text-[10px] opacity-70 flex items-center gap-1">Ver detalles <Icons.ArrowRight/></div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex h-screen bg-gray-100 overflow-hidden">
                    <Sidebar sidebarOpen={sidebarOpen} setSidebarOpen={setSidebarOpen} view={view} setView={(v)=>{setView(v);setMonitorRegion(null);setSelectedPatient(null)}} isOnline={isOnline} onLogout={onLogout} />
                    <main className="flex-1 overflow-y-auto p-8 relative">
                        <TopBar user={{name: 'Admin', role: 'ADMIN'}} />
                        
                        {view === 'dashboard' && !monitorRegion && (
                            <div className="space-y-8 fade-in">
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                    <StatCard title="Pacientes" value={patients.length} sub="Registrados" color="border-l-blue-500" onClick={()=>setView('new_dh')}/>
                                    <StatCard title="Envíos Activos" value={activeOrders.length} sub="En proceso" color="border-l-turquesa-500" onClick={()=>{}}/>
                                    <StatCard title="Entregados" value={deliveredOrders.length} sub="Este mes" color="border-l-clinico-500" onClick={()=>{}}/>
                                    <StatCard title="Personal" value={users.length} sub="Usuarios" color="border-l-purple-500" onClick={()=>{}}/>
                                </div>
                                <h3 className="text-lg font-bold text-gray-700 mt-8 mb-4">Monitoreo por Zona</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <ZoneCard title="Locales SPS" count={geoDistribution.sps.length} type="sps" onClick={()=>setMonitorRegion('sps')} />
                                    <ZoneCard title="Foráneos" count={geoDistribution.foraneos.length} type="foraneos" onClick={()=>setMonitorRegion('foraneos')} />
                                    <ZoneCard title="La Ceiba" count={geoDistribution.ceiba.length} type="ceiba" onClick={()=>setMonitorRegion('ceiba')} />
                                </div>
                            </div>
                        )}

                        {view === 'dashboard' && monitorRegion && (
                            <div className="fade-in bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden min-h-[500px]">
                                <div className="p-6 border-b flex justify-between items-center bg-gray-50">
                                    <div className="flex items-center gap-4"><button onClick={()=>setMonitorRegion(null)} className="p-2 bg-white rounded-xl shadow-sm hover:text-turquesa-600"><Icons.ArrowRight className="transform rotate-180"/></button><div><h2 className="text-xl font-bold text-gray-800 capitalize">Zona: {monitorRegion}</h2><p className="text-xs text-gray-500">Listado de paquetes activos</p></div></div>
                                    <div className="bg-turquesa-100 text-turquesa-700 px-3 py-1 rounded-full text-xs font-bold">{geoDistribution[monitorRegion].length} Envíos</div>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-white text-gray-400 font-bold text-xs uppercase border-b"><tr><th className="p-4">Paciente</th><th className="p-4">Estado</th><th className="p-4">Ubicación</th><th className="p-4">Responsables</th></tr></thead>
                                        <tbody className="divide-y divide-gray-50">
                                            {geoDistribution[monitorRegion].map(o => (
                                                <tr key={o.id} className="hover:bg-gray-50 transition-colors">
                                                    <td className="p-4"><p className="font-bold text-gray-700">{o.dhName}</p><p className="text-xs text-gray-400 font-mono">{o.dhId}</p></td>
                                                    <td className="p-4">{getStatusBadge(o.status)}</td>
                                                    <td className="p-4 text-gray-500">{o.municipality}</td>
                                                    <td className="p-4 text-xs text-gray-400">{o.assignedPharma} / {o.assignedCC}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {view === 'new_dh' && !selectedPatient && (
                            <div className="space-y-6 fade-in">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-xl font-bold text-gray-800">Directorio de Derechohabientes</h2>
                                    <div className="flex gap-2">
                                        <Button variant="neutral" icon={Icons.Upload} onClick={()=>setShowImport(true)}>Importar</Button>
                                        <Button variant="primary" icon={Icons.Plus} onClick={()=>setShowDHForm(true)}>Nuevo Paciente</Button>
                                    </div>
                                </div>
                                <div className="bg-white p-2 rounded-xl shadow-sm border flex items-center gap-2">
                                    <Icons.Search className="text-gray-400 ml-2"/>
                                    <input className="w-full p-2 outline-none text-gray-600" placeholder="Buscar por DNI o Nombre..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)}/>
                                </div>
                                <div className="bg-white rounded-2xl shadow-sm border overflow-hidden">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-gray-50 text-gray-500 font-bold text-xs uppercase"><tr><th className="p-4">ID</th><th className="p-4">Nombre</th><th className="p-4">Tipo</th><th className="p-4 text-right">Acción</th></tr></thead>
                                        <tbody className="divide-y divide-gray-100">
                                            {filteredPatients.map(p => (
                                                <tr key={p.id} className="hover:bg-blue-50 cursor-pointer transition-colors" onClick={()=>setSelectedPatient(p)}>
                                                    <td className="p-4 font-mono text-gray-500">{p.id}</td><td className="p-4 font-bold text-gray-700">{p.name}</td><td className="p-4 text-xs bg-gray-100 rounded">{p.affiliateType}</td>
                                                    <td className="p-4 text-right text-turquesa-600 font-bold text-xs">Ver Expediente &rarr;</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {view === 'new_dh' && selectedPatient && (
                            <div className="fade-in">
                                <button onClick={()=>setSelectedPatient(null)} className="mb-4 text-sm text-gray-400 hover:text-turquesa-600 flex items-center gap-2"><Icons.ArrowRight className="transform rotate-180"/> Volver al Directorio</button>
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                    <div className="lg:col-span-1 space-y-6">
                                        <div className="bg-white p-6 rounded-3xl shadow-lg border border-gray-100 text-center">
                                            <div className="w-20 h-20 bg-turquesa-100 rounded-full flex items-center justify-center mx-auto mb-4 text-turquesa-600"><Icons.User size="32"/></div>
                                            <h2 className="text-xl font-bold text-gray-800">{selectedPatient.name}</h2>
                                            <p className="text-sm text-gray-400 font-mono mb-4">{selectedPatient.id}</p>
                                            <div className="text-left text-sm space-y-2 bg-gray-50 p-4 rounded-xl">
                                                <p className="flex justify-between"><span>Tel:</span> <strong>{selectedPatient.phone}</strong></p>
                                                <p className="flex justify-between"><span>Muni:</span> <strong>{selectedPatient.municipality}</strong></p>
                                                <p className="text-xs text-gray-500 mt-2">{selectedPatient.address}</p>
                                            </div>
                                        </div>
                                        <div className="bg-gradient-to-br from-turquesa-500 to-clinico-500 p-6 rounded-3xl shadow-lg text-white">
                                            <h3 className="font-bold mb-4 flex items-center gap-2"><Icons.Plus/> Nueva Orden</h3>
                                            <div className="space-y-3 text-gray-800">
                                                <select className="w-full p-2 rounded-lg text-sm" value={orderForm.shippingZone} onChange={e=>setOrderForm({...orderForm, shippingZone:e.target.value})}>{SHIPPING_ZONES.map(z=><option key={z} value={z}>{z}</option>)}</select>
                                                <select className="w-full p-2 rounded-lg text-sm" value={orderForm.assignedPharma} onChange={e=>setOrderForm({...orderForm, assignedPharma:e.target.value})}><option value="">Farmacia...</option>{users.filter(u=>u.role==='FARMACIA').map(u=><option key={u.id} value={u.username}>{u.name}</option>)}</select>
                                                <select className="w-full p-2 rounded-lg text-sm" value={orderForm.assignedCC} onChange={e=>setOrderForm({...orderForm, assignedCC:e.target.value})}><option value="">Call Center...</option>{users.filter(u=>u.role==='CC').map(u=><option key={u.id} value={u.username}>{u.name}</option>)}</select>
                                                <button onClick={handleCreateOrder} className="w-full bg-white text-turquesa-600 font-bold py-2 rounded-lg hover:bg-gray-100 transition-colors">Generar Envío</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="lg:col-span-2">
                                        <h3 className="font-bold text-gray-700 text-lg mb-4">Historial de Envíos</h3>
                                        <div className="space-y-4">
                                            {orders.filter(o=>o.dhId===selectedPatient.id).map(o=>(
                                                <div key={o.id} className="bg-white p-4 rounded-2xl border shadow-sm flex justify-between items-center">
                                                    <div><div className="flex items-center gap-2 mb-1">{getStatusBadge(o.status)}</div><p className="text-xs text-gray-400">Fecha: {new Date(o.createdAt?.seconds*1000).toLocaleDateString()}</p></div>
                                                    <div className="text-right"><span className="bg-gray-100 text-gray-600 text-[10px] font-bold px-2 py-1 rounded">{o.shippingZone}</span></div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'users' && (
                            <div className="space-y-6 fade-in">
                                <Card title="Registrar Nuevo Colaborador">
                                    <form onSubmit={handleCreateUser} className="flex flex-col md:flex-row gap-4 items-end bg-slate-50 p-5 rounded-xl border border-slate-200">
                                        <div className="flex-1 w-full"><label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Usuario</label><input required className="w-full border p-2 rounded-lg" value={newUser.username} onChange={e => setNewUser({...newUser, username: e.target.value})} /></div>
                                        <div className="flex-[2] w-full"><label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Nombre</label><input required className="w-full border p-2 rounded-lg" value={newUser.name} onChange={e => setNewUser({...newUser, name: e.target.value})} /></div>
                                        <div className="flex-1 w-full"><label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Rol</label>
                                            <select className="w-full border p-2 rounded-lg bg-white" value={newUser.role} onChange={e => setNewUser({...newUser, role: e.target.value})}><option value="FARMACIA">Farmacia</option><option value="CC">Contact Center</option><option value="OPS">Operaciones</option><option value="CALIDAD">Calidad</option><option value="LOGISTICA">Logística</option></select>
                                        </div>
                                        <Button variant="success" icon={Icons.Users} type="submit">Crear</Button>
                                    </form>
                                </Card>
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-slate-50 text-slate-500 uppercase font-bold text-xs"><tr><th className="px-6 py-3">Usuario</th><th className="px-6 py-3">Nombre</th><th className="px-6 py-3">Rol</th><th className="px-6 py-3 text-right">Acciones</th></tr></thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {users.map(u => (
                                                <tr key={u.id} className="hover:bg-slate-50 transition-colors">
                                                    <td className="px-6 py-4 font-medium text-turquesa-700">{u.username}</td><td className="px-6 py-4">{u.name}</td><td className="px-6 py-4"><span className="px-2 py-1 rounded-full bg-slate-100 text-slate-600 text-xs font-bold">{u.role}</span></td>
                                                    <td className="px-6 py-4 text-right flex justify-end gap-2"><button onClick={() => openEditUser(u)} className="p-1.5 rounded-lg text-slate-400 hover:text-turquesa-600 hover:bg-turquesa-50" title="Editar"><Icons.Edit/></button><button onClick={() => handleDeleteUser(u.id)} className="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50" title="Eliminar"><Icons.Trash/></button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        <Modal isOpen={showDHForm} onClose={()=>setShowDHForm(false)} title="Registrar Derechohabiente">
                            <form onSubmit={handleSavePatient} className="grid grid-cols-2 gap-4">
                                <input className="p-3 border rounded-xl" placeholder="DNI" value={formData.id} onChange={e=>setFormData({...formData, id:e.target.value})} required />
                                <input className="p-3 border rounded-xl" placeholder="Nombre Completo" value={formData.name} onChange={e=>setFormData({...formData, name:e.target.value})} required />
                                <input className="p-3 border rounded-xl" placeholder="Teléfono" value={formData.phone} onChange={e=>setFormData({...formData, phone:e.target.value})} />
                                <input className="p-3 border rounded-xl" placeholder="Dirección" value={formData.address} onChange={e=>setFormData({...formData, address:e.target.value})} />
                                <select className="p-3 border rounded-xl bg-white" value={formData.municipality} onChange={e=>setFormData({...formData, municipality:e.target.value})}><option value="">Municipio...</option><option value="San Pedro Sula">San Pedro Sula</option><option value="La Ceiba">La Ceiba</option><option value="Choloma">Choloma</option><option value="Villanueva">Villanueva</option></select>
                                <select className="p-3 border rounded-xl bg-white" value={formData.shippingZone} onChange={e=>setFormData({...formData, shippingZone:e.target.value})}>{SHIPPING_ZONES.map(z=><option key={z} value={z}>{z}</option>)}</select>
                                <div className="col-span-2 flex justify-end pt-4"><Button type="submit">Guardar Registro</Button></div>
                            </form>
                        </Modal>
                        
                        <Modal isOpen={showImport} onClose={() => setShowImport(false)} title="Carga Masiva">
                            <div className="space-y-4">
                                <p className="text-sm text-slate-600">Pega aquí tu base de datos en formato JSON.</p>
                                <textarea className="w-full h-40 border p-3 rounded-xl font-mono text-xs bg-slate-50" placeholder='[{"id":"0801...", "name":"Juan", ...}]' value={importData} onChange={e => setImportData(e.target.value)}></textarea>
                                <div className="flex justify-end gap-2"><Button variant="neutral" onClick={() => setShowImport(false)}>Cancelar</Button><Button variant="success" icon={Icons.Upload} onClick={handleBulkImport}>Procesar</Button></div>
                            </div>
                        </Modal>

                        {editingUser && (
                            <Modal isOpen={true} onClose={() => setEditingUser(null)} title="Modificar Credenciales">
                                <div className="space-y-4">
                                    <p className="text-sm text-slate-500">Editando: <strong>{editingUser.name}</strong></p>
                                    <div><label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Nueva Contraseña</label><input className="w-full border p-2 rounded-lg" type="text" value={editForm.password} onChange={e => setEditForm({...editForm, password: e.target.value})} /></div>
                                    <div><label className="text-xs font-bold text-slate-500 uppercase mb-1 block">Rol</label><select className="w-full border p-2 rounded-lg bg-white" value={editForm.role} onChange={e => setEditForm({...editForm, role: e.target.value})}><option value="FARMACIA">Farmacia</option><option value="CC">Contact Center</option><option value="OPS">Operaciones</option><option value="CALIDAD">Calidad</option><option value="LOGISTICA">Logística</option><option value="ADMIN">Admin</option></select></div>
                                    <div className="flex gap-2 justify-end mt-4"><Button variant="neutral" onClick={() => setEditingUser(null)}>Cancelar</Button><Button variant="primary" onClick={handleUpdateUser}>Guardar</Button></div>
                                </div>
                            </Modal>
                        )}
                    </main>
                </div>
            );
        };

        // --- APP PRINCIPAL ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [data, setData] = useState({ orders: [], patients: [], users: [] });
            const [modal, setModal] = useState({ isOpen: false });

            useEffect(() => {
                if(!db) return;
                const unsubs = ['users', 'orders', 'patients'].map(col => 
                    db.collection(col).onSnapshot(snap => setData(prev => ({ ...prev, [col]: snap.docs.map(d => ({id:d.id, ...d.data()})) })))
                );
                return () => unsubs.forEach(u => u());
            }, []);

            const seedDB = async () => {
                const batch = INITIAL_USERS_SEED.map(u => db.collection('users').add(u));
                await Promise.all(batch);
                setModal({isOpen:true, title:"Listo", message:"Base de datos inicializada."});
            };

            // Para no cortar el archivo, solo mostramos la vista ADMIN que es la solicitada. 
            // Los otros roles se activarían igual que Block1Admin.

            if (!user) return <Login onLogin={setUser} usersDB={data.users} seedDB={seedDB} setModal={setModal} />;

            return (
                <div className="min-h-screen bg-gray-50">
                    <Modal {...modal} onClose={()=>setModal({isOpen:false})} />
                    {user.role === 'ADMIN' ? <Block1Admin {...data} setModal={setModal} isOnline={isOnline} onLogout={() => setUser(null)} /> : <div className="p-10 text-center">Panel de {user.role} (Cargar módulos restantes...)</div>}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
